<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Barcode & UPC Finder</title>
  <!-- Free Tailwind CSS for clean styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Free JsBarcode Library for rendering scannable barcodes -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center p-6">

  <div class="max-w-2xl w-full bg-white rounded-2xl shadow-md p-6 md:p-8 mt-4">
    <h1 class="text-2xl font-bold text-slate-900 mb-2">Global Barcode & UPC Finder</h1>
    <p class="text-sm text-slate-500 mb-6">
      Enter a <strong>Product Name</strong> (e.g., <em>Maggi Noodles</em>, <em>Coca Cola</em>) to search global databases, or type any <strong>Item Code / UPC / SKU</strong> to generate a barcode instantly.
    </p>

    <!-- Search / Input Box -->
    <div class="flex flex-col sm:flex-row gap-3 mb-6">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Enter product name or item code..." 
        class="flex-1 border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
        onkeypress="if(event.key === 'Enter') handleAction()"
      />
      <button 
        onclick="handleAction()" 
        class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-xl transition cursor-pointer">
        Find / Generate
      </button>
    </div>

    <!-- Status Message -->
    <div id="statusMsg" class="text-sm text-slate-500 mb-4 hidden"></div>

    <!-- Barcode Display Card -->
    <div id="barcodeCard" class="hidden border border-slate-200 rounded-xl p-6 bg-slate-50 flex flex-col items-center text-center mb-6">
      <h2 id="displayTitle" class="font-semibold text-lg text-slate-800 mb-1"></h2>
      <p id="displayFormat" class="text-xs text-slate-500 uppercase tracking-wider mb-4"></p>
      
      <div class="bg-white p-4 rounded-lg shadow-sm border border-slate-100">
        <svg id="barcodeSvg"></svg>
      </div>

      <button 
        onclick="downloadBarcode()" 
        class="mt-4 bg-slate-800 hover:bg-slate-900 text-white text-sm px-4 py-2 rounded-lg transition cursor-pointer">
        Download PNG
      </button>
    </div>

    <!-- Search Results List (for Product Name searches) -->
    <div id="resultsList" class="space-y-3"></div>
  </div>

  <script>
    function handleAction() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const resultsList = document.getElementById('resultsList');
      resultsList.innerHTML = '';

      // Check if input is purely numeric or a custom SKU (no spaces, mostly digits or SKU format)
      const isCode = /^[0-9]{8,14}$/.test(query) || (/^[A-Za-z0-9-_]+$/.test(query) && query.length <= 20 && /\d/.test(query) && !query.includes(' '));

      if (isCode) {
        renderBarcode(query, 'Custom / Direct Item Code');
      } else {
        searchProductDatabase(query);
      }
    }

    async function searchProductDatabase(productName) {
      const statusMsg = document.getElementById('statusMsg');
      const barcodeCard = document.getElementById('barcodeCard');
      const resultsList = document.getElementById('resultsList');

      barcodeCard.classList.add('hidden');
      statusMsg.classList.remove('hidden');
      statusMsg.textContent = `Searching global databases for "${productName}"...`;

      try {
        // Query Open Food Facts (Free global database with strong Indian & international coverage)
        const response = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(productName)}&search_simple=1&action=process&json=1&page_size=8`, {
          headers: { 'User-Agent': 'GlobalBarcodeFinderApp/1.0' }
        });
        const data = await response.json();

        const validProducts = (data.products || []).filter(p => p.code && p.product_name);

        if (validProducts.length === 0) {
          statusMsg.textContent = `No exact match found in open databases for "${productName}". If you have the item number, enter it directly above to generate its barcode.`;
          return;
        }

        statusMsg.textContent = `Found ${validProducts.length} matching products. Click one to generate its barcode:`;

        validProducts.forEach(product => {
          const item = document.createElement('div');
          item.className = 'flex items-center justify-between p-4 border border-slate-200 rounded-xl hover:bg-blue-50 hover:border-blue-300 cursor-pointer transition';
          item.onclick = () => renderBarcode(product.code, `${product.product_name} ${product.brands ? '(' + product.brands + ')' : ''}`);

          item.innerHTML = `
            <div class="flex items-center gap-3">
              ${product.image_front_small_url ? `<img src="${product.image_front_small_url}" class="w-12 h-12 object-contain rounded bg-white border p-1" />` : '<div class="w-12 h-12 bg-slate-200 rounded flex items-center justify-center text-xs text-slate-500">No Img</div>'}
              <div>
                <div class="font-medium text-slate-900">${product.product_name}</div>
                <div class="text-xs text-slate-500">${product.brands || 'Brand unlisted'} • Code: <span class="font-mono font-semibold text-slate-700">${product.code}</span></div>
              </div>
            </div>
            <span class="text-xs font-semibold text-blue-600 bg-blue-100 px-3 py-1 rounded-full">Generate →</span>
          `;
          resultsList.appendChild(item);
        });

      } catch (error) {
        statusMsg.textContent = 'Error connecting to the product database. Please try again.';
      }
    }

    function renderBarcode(code, title) {
      const barcodeCard = document.getElementById('barcodeCard');
      const displayTitle = document.getElementById('displayTitle');
      const displayFormat = document.getElementById('displayFormat');
      const statusMsg = document.getElementById('statusMsg');

      // Auto-detect barcode standard
      let format = 'CODE128';
      if (/^\d{12}$/.test(code)) format = 'UPC';
      else if (/^\d{13}$/.test(code)) format = 'EAN13';
      else if (/^\d{8}$/.test(code)) format = 'EAN8';

      try {
        JsBarcode('#barcodeSvg', code, {
          format: format,
          lineColor: '#000000',
          width: 2,
          height: 90,
          displayValue: true,
          margin: 15
        });

        displayTitle.textContent = title;
        displayFormat.textContent = `Format: ${format} • Code: ${code}`;
        barcodeCard.classList.remove('hidden');
        statusMsg.classList.add('hidden');
        barcodeCard.scrollIntoView({ behavior: 'smooth' });
      } catch (e) {
        // Fallback to universal CODE128 if check-digit fails on a custom 12/13 digit number
        JsBarcode('#barcodeSvg', code, {
          format: 'CODE128',
          lineColor: '#000000',
          width: 2,
          height: 90,
          displayValue: true,
          margin: 15
        });
        displayTitle.textContent = title;
        displayFormat.textContent = `Format: CODE128 (Custom/Unverified Check Digit) • Code: ${code}`;
        barcodeCard.classList.remove('hidden');
        statusMsg.classList.add('hidden');
      }
    }

    function downloadBarcode() {
      const svg = document.getElementById('barcodeSvg');
      const serializer = new XMLSerializer();
      const svgData = serializer.serializeToString(svg);
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();

      img.onload = function() {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);

        const pngUrl = canvas.toDataURL('image/png');
        const downloadLink = document.createElement('a');
        downloadLink.href = pngUrl;
        downloadLink.download = 'barcode.png';
        downloadLink.click();
      };

      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
    }
  </script>
</body>
</html>
